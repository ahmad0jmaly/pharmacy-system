        <dt>العيادة</dt><dd>${esc(r.clinic || '—')}</dd>
        <dt>العنوان المختصر</dt><dd><span class="mono">${esc(r.short_address)}</span>${copyBtn(r.short_address, 'العنوان')}</dd></dl>
        <button class="btn sm" data-copy="${esc([r.full_name, r.phone, r.phone2, r.short_address, r.clinic].filter(Boolean).join('\n'))}" data-label="بيانات التوصيل">نسخ بيانات التوصيل</button>
        ${p ? '<button class="btn sm" data-a="apply">اعتماد البيانات في ملف المريض</button>' : ''}
        <label class="f" style="margin-top:12px"><span>حالة التوصيل</span><select id="dst">${Object.entries({ new: 'جديد', coordinating: 'قيد التنسيق', ready: 'جاهز للتوصيل', out: 'خرج للتوصيل', delivered: 'تم التسليم', failed: 'متعذر' }).map(([k, v]) => `<option value="${k}" ${r.delivery_status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>` : ''}
      ${r.type === 'shortage' ? `<b>مراجعة النقص</b> <span class="hint">لا يتحول البلاغ تلقائيًا إلى صرف جديد</span>
        <label class="f" style="margin-top:6px"><span>ما طُلب</span><input type="text" id="s1" value="${esc(r.shortage_requested || '')}"></label>
        <label class="f"><span>ما صُرف</span><input type="text" id="s2" value="${esc(r.shortage_dispensed || '')}"></label>
        <label class="f"><span>ما استُلم</span><input type="text" id="s3" value="${esc(r.shortage_received || '')}"></label>
        <label class="f"><span class="req">الإجراء المتخذ</span><textarea id="s4" rows="2">${esc(r.shortage_action || '')}</textarea></label>` : ''}
    </div></div>
    <div class="sep"></div>
    <div class="grid g2"><label class="f"><span>حالة الطلب</span><select id="st">${Object.entries({ new: 'جديد', in_progress: 'قيد المعالجة', needs_info: 'يحتاج استكمال بيانات', done: 'مكتمل', rejected: 'مغلق/مرفوض' }).map(([k, v]) => `<option value="${k}" ${r.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label class="f" id="niBox"><span>المطلوب من المريض (يظهر له في البوابة)</span><input type="text" id="ni" value="${esc(r.needs_info_note || '')}"></label></div>
    <label class="f"><span>ملاحظة داخلية</span><textarea id="sn" rows="2">${esc(r.staff_note || '')}</textarea></label>
    ${r.wa_link ? `<a class="btn wa sm" href="${esc(r.wa_link)}" target="_blank" rel="noopener">إرسال طلب الاستكمال عبر واتساب</a>` : ''}
    ${admin ? `<div class="sep"></div><div class="row">${!p ? `<input type="text" id="lmrn" placeholder="ربط برقم ملف موجود" dir="ltr"><button class="btn sm" data-a="link">ربط</button>${r.full_name ? '<button class="btn sm" data-a="create">إنشاء ملف جديد من الطلب</button>' : ''}` : ''}
      <span class="spacer"></span><select id="ato"><option value="">غير مسند</option>${userOptions(r.assigned_to)}</select><button class="btn sm" data-a="assign">إسناد الطلب</button></div>` : ''}
    ${r.log.length ? `<div class="sep"></div><b>السجل</b><ul class="timeline">${r.log.map((l) => `<li>${esc(l.action)} ${l.details ? `<span class="hint">${esc(fmtDetails(l.details))}</span>` : ''}<br><small>${esc(l.user_name)} · ${fmtTime(l.at)}</small></li>`).join('')}</ul>` : ''}
    <div class="err"></div></div>`);
  const m = modal('طلب مريض', box, { wide: true, footer: '<button class="btn primary" data-save>حفظ</button>' });
  const refresh = () => { m.close(); openRequest(rid, after); after && after(); refreshCounts(); };
  $('[data-save]', m).onclick = async () => {
    const b = { status: $('#st', box).value, needs_info_note: $('#ni', box).value, staff_note: $('#sn', box).value };
    if ($('#dst', box)) b.delivery_status = $('#dst', box).value;
    if ($('#s1', box)) Object.assign(b, { shortage_requested: $('#s1', box).value, shortage_dispensed: $('#s2', box).value, shortage_received: $('#s3', box).value, shortage_action: $('#s4', box).value });
    try { await PATCH('/api/requests/' + rid, b); toast('تم الحفظ'); refresh(); } catch (e) { $('.err', box).textContent = e.message; }
  };
  $$('[data-a]', box).forEach((b) => b.onclick = async (e) => {
    e.preventDefault();
    const a = b.dataset.a;
    try {
      if (a === 'patient') { m.close(); openPatient(p.id, after); }
      if (a === 'apply') { const res = await POST(`/api/requests/${rid}/apply`); toast(res.changed.length ? 'تم تحديث ملف المريض (حُفظت القيم السابقة)' : 'البيانات مطابقة للملف'); refresh(); }
      if (a === 'link') { await POST(`/api/requests/${rid}/link`, { mrn: $('#lmrn', box).value }); toast('تم الربط'); refresh(); }
      if (a === 'create') { await POST(`/api/requests/${rid}/create-patient`); toast('تم إنشاء الملف — أسنده من صفحة التوزيع'); refresh(); }
      if (a === 'assign') { await POST(`/api/requests/${rid}/assign`, { to_user: $('#ato', box).value }); toast('تم الإسناد'); refresh(); }
    } catch (err) { toast(err.message, true); }
  });
}

// ============================================================ توزيع المرضى
VIEWS.distribute = async () => {
  const pg = page('توزيع المرضى', 'كل مريض يُسند لموظف واحد ولا يظهر لغيره من الموظفين');
  const d = await GET('/api/dashboard');
  const emps = d.employees.filter((e) => e.active);
  pg.innerHTML = `<div class="grid g2">
    <div class="card"><h3>المرضى غير المسندين: <span class="num">${d.totals.unassigned}</span></h3>
      <p class="hint">التوزيع بالتساوي يقسم العدد على الموظفين. التوزيع حسب الحالات المفتوحة يعطي الموظف الأقل حملًا أولًا.</p>
      <div class="row"><button class="btn primary" id="auto" ${d.totals.unassigned ? '' : 'disabled'}>توزيع تلقائي</button><a class="btn" href="#/patients?assigned=none">اختيار يدوي من القائمة</a></div></div>
    <div class="card"><h3>نقل مسؤولية مرضى بين الموظفين</h3>
      <div class="grid g2"><label class="f"><span>من</span><select id="from">${userOptions('', (u) => u.role === 'employee')}</select></label>
      <label class="f"><span>إلى</span><select id="to"><option value="auto">توزيع على البقية تلقائيًا</option>${userOptions('')}</select></label></div>
      <label class="f"><span>نطاق النقل</span><select id="scope"><option value="all">جميع مرضاه</option><option value="open">الحالات المفتوحة فقط (بانتظار المراجعة/المتأخرة)</option></select></label>
      <label class="f"><span>السبب</span><input type="text" id="rsn" placeholder="مثال: إجازة"></label>
      <button class="btn primary" id="move">نقل</button></div></div>
    <div class="card" style="margin-top:14px"><h3>الحمل الحالي</h3><div class="tw"><table class="t"><thead><tr><th>الموظف</th><th>المسند</th><th>بانتظار المراجعة</th><th>متأخر</th><th>طلبات مفتوحة</th><th>لدى تجربة المريض</th><th></th></tr></thead><tbody>
      ${emps.map((e) => `<tr><td>${esc(e.name)}</td><td class="num">${e.patients}</td><td class="num">${e.due}</td><td class="num">${e.overdue}</td><td class="num">${e.open_requests}</td><td class="num">${e.at_px}</td><td><a class="btn sm" href="#/patients?assigned=${e.id}">عرض مرضاه</a></td></tr>`).join('') || '<tr><td colspan="7" class="empty">لا يوجد موظفون نشطون</td></tr>'}</tbody></table></div></div>`;
  $('#auto').onclick = () => autoDistributeDialog(null, () => VIEWS.distribute());
  $('#move').onclick = () => guard(async () => {
    const from = $('#from').value, to = $('#to').value;
    if (!from) return toast('اختر الموظف', true);
    if (from === to) return toast('اختر موظفًا مختلفًا', true);
    const qp = new URLSearchParams({ assigned: from }); if ($('#scope').value === 'open') qp.set('due', 'queue');
    const ids = await GET('/api/patients/ids?' + qp);
    if (!ids.length) return toast('لا يوجد مرضى للنقل', true);
    if (!(await confirmBox(`نقل <b>${ids.length}</b> مريض؟`, 'نقل'))) return;
    if (to === 'auto') {
      const users = emps.filter((e) => String(e.id) !== from).map((e) => e.id);
      const r = await POST('/api/assign/auto', { mode: 'load', user_ids: users, scope: 'selected', patient_ids: ids });
      toast('تم: ' + Object.entries(r.result).map(([n, c]) => `${n} ${c}`).join('، '));
    } else {
      const r = await POST('/api/assign', { patient_ids: ids, to_user: to, reason: $('#rsn').value || 'نقل مسؤولية' });
      toast(`تم نقل ${r.moved} مريض`);
    }
    refreshCounts(); VIEWS.distribute();
  });
};

// ============================================================ الاستيراد
VIEWS.import = async () => {
  const pg = page('استيراد Excel', 'يقرأ النظام لون كل صف ويحوّله إلى حالة، مع معاينة قبل الاعتماد', '<button class="btn" id="sample">تنزيل ملف نموذجي</button>');
  $('#sample').onclick = () => guard(() => download('GET', '/api/import/sample'));
  pg.innerHTML = `<div class="card"><div class="row"><input type="file" id="file" accept=".xlsx,.xlsm"><label class="check"><input type="checkbox" id="useFont" checked> قراءة لون الخط إذا لم يكن للخلية تعبئة</label></div>
    <p class="hint">يدعم xlsx. الألوان المقروءة هي تعبئة الخلايا (وليست التنسيق الشرطي). إذا كان الملف xls قديمًا احفظه بصيغة xlsx أولًا.</p></div><div id="imp"></div>`;
  let st = null;
  $('#file').onchange = async () => {
    const f = $('#file').files[0]; if (!f) return;
    const fd = new FormData(); fd.append('file', f); fd.append('use_font', $('#useFont').checked ? '1' : '0');
    $('#imp').innerHTML = '<div class="card empty">جارٍ قراءة الملف…</div>';
    try {
      st = await api('POST', '/api/import/parse', fd);
      st.date_mode = 'due'; st.interval = 30;
      if (st.analysis.past_dates > st.analysis.valid / 2) {
        st.date_mode = 'last';
        st.analysis = await POST('/api/import/preview', { token: st.token, mapping: st.mapping, color_actions: st.color_actions, date_mode: 'last', interval: 30 });
      }
      render();
    } catch (e) { $('#imp').innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
  };
  const mappingSel = (field) => `<select data-map="${field}"><option value="">— غير موجود —</option>${st.headers.map((h, i) => `<option value="${i}" ${st.mapping[field] === i ? 'selected' : ''}>${esc(h)}</option>`).join('')}</select>`;
  const ACTIONS = { not_eligible: 'غير مستحق', eligible: 'مستحق', out_of_city: 'خارج المدينة', no_rx: 'لا توجد وصفة فعّالة', ignore: 'تجاهل اللون (بانتظار المراجعة)', skip: 'استبعاد الصف' };
  const render = () => {
    const a = st.analysis;
    const colorsPresent = Object.keys(a.colors).filter((c) => c !== 'none');
    $('#imp').innerHTML = `
      <div class="grid g2" style="margin-top:14px">
        <div class="card"><h3>1. ربط الأعمدة</h3>${st.sheets.length > 1 ? `<label class="f"><span>الورقة</span><select id="sheet">${st.sheets.map((s) => `<option ${s === st.sheet ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></label>` : ''}
          <p class="hint">صف العناوين المكتشف: ${st.header_row}</p>
          <div class="grid g2">${Object.entries(st.fields).map(([k, v]) => `<label class="f"><span class="${k === 'mrn' ? 'req' : ''}">${v}</span>${mappingSel(k)}</label>`).join('')}</div></div>
        <div class="card"><h3>2. معنى الألوان</h3>
          ${colorsPresent.length ? colorsPresent.map((c) => `<div class="row" style="margin-bottom:8px"><span class="dot" style="background:${COLOR_HEX[c]}"></span><b style="width:70px">${esc(st.color_labels[c])}</b><span class="hint num">${a.colors[c]} صف</span><span class="spacer"></span>
            <select data-color="${c}">${Object.entries(ACTIONS).map(([k, v]) => `<option value="${k}" ${(st.color_actions[c] || 'ignore') === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>`).join('') : '<p class="hint">لا توجد ألوان في الملف</p>'}
          <p class="hint">بدون لون: ${a.colors.none || 0} صف → بانتظار المراجعة</p>
          <label class="check"><input type="checkbox" id="saveColors" checked> حفظ معاني الألوان للاستيرادات القادمة</label>
          <div class="sep"></div><h3>3. معنى التاريخ في الملف</h3>
          ${a.past_dates ? `<p class="hint" style="color:var(--amber)">${a.past_dates} من التواريخ في الماضي — غالبًا تمثل تاريخ آخر صرف.</p>` : ''}
          <div class="row"><select id="dmode"><option value="due" ${st.date_mode === 'due' ? 'selected' : ''}>موعد المراجعة/الاستحقاق نفسه</option><option value="last" ${st.date_mode === 'last' ? 'selected' : ''}>تاريخ آخر صرف + مدة الصرف</option></select>
          <span ${st.date_mode === 'last' ? '' : 'hidden'} id="ivBox">المدة <input type="number" id="iv" min="1" max="365" value="${st.interval || 30}" style="width:80px"> يوم</span></div>
          <div class="sep"></div><h3>4. خيارات</h3>
          <label class="f"><span>المرضى الموجودون مسبقًا (${a.existing})</span><select id="existing"><option value="skip">تجاهلهم</option><option value="update">تحديث بياناتهم (مع حفظ القيم السابقة)</option></select></label>
          <label class="check"><input type="checkbox" id="updDates"> تحديث تاريخ المراجعة للموجودين</label><br>
          <label class="check"><input type="checkbox" id="refer"> إحالة غير المستحقين/بلا وصفة المستوردين إلى تجربة المريض</label>
          <label class="f" style="margin-top:10px"><span>إسناد المرضى الجدد</span><select id="assign"><option value="">بدون إسناد (أوزعهم لاحقًا)</option><option value="equal">توزيع بالتساوي على الموظفين</option><option value="load">توزيع حسب الحالات المفتوحة</option>${userOptions('').replace(/<option value="/g, '<option value="')}</select></label>
        </div></div>
      <div class="card" style="margin-top:14px"><h3>5. المعاينة</h3>
        <div class="kpis"><div class="kpi"><div class="v">${a.total}</div><div class="l">صفوف الملف</div></div><div class="kpi ok"><div class="v">${a.new}</div><div class="l">مرضى جدد</div></div>
          <div class="kpi"><div class="v">${a.existing}</div><div class="l">موجودون مسبقًا</div></div><div class="kpi ${a.errors.length ? 'warn' : ''}"><div class="v">${a.errors.length}</div><div class="l">أخطاء (لن تُستورد)</div></div>
          <div class="kpi amber"><div class="v">${a.warnings.length}</div><div class="l">تنبيهات</div></div></div>
        <p class="hint">التوزيع: بانتظار المراجعة ${a.counts.pending || 0} · غير مستحق ${a.counts.not_eligible || 0} · مستحق ${a.counts.eligible || 0} · لا وصفة ${a.counts.no_rx || 0} · خارج المدينة ${a.counts.out_of_city || 0} · لا يرغب بالشحن الدوري ${a.counts.not_periodic || 0}${a.counts.skipped ? ' · مستبعد ' + a.counts.skipped : ''}</p>
        ${a.errors.length ? `<details open><summary class="err">الأخطاء (${a.errors.length})</summary><ul>${a.errors.slice(0, 100).map((e) => `<li>صف ${e.row}: ${esc(e.msg)}</li>`).join('')}</ul></details>` : ''}
        ${a.warnings.length ? `<details><summary>التنبيهات (${a.warnings.length})</summary><ul>${a.warnings.slice(0, 200).map((e) => `<li>صف ${e.row}: ${esc(e.msg)}</li>`).join('')}</ul></details>` : ''}
        <div class="tw" style="max-height:420px;margin-top:10px"><table class="t"><thead><tr><th>صف</th><th>اللون</th><th>رقم الملف</th><th>الاسم</th><th>الجوال</th><th>العيادة</th><th>المدينة</th><th>العنوان</th><th>التاريخ</th><th>الحالة بعد الاستيراد</th><th></th></tr></thead><tbody>
          ${a.preview.map((r) => `<tr><td class="num">${r.row}</td><td><span class="dot" style="background:${r.hex ? '#' + r.hex : '#fff'}"></span></td><td class="mono">${esc(r.mrn)}</td><td>${esc(r.name)}</td><td class="mono">${esc(r.phone)}</td><td>${esc(r.clinic)}</td><td>${esc(r.city)}</td><td class="mono">${esc(r.address)}</td><td>${fmtDate(r.review_date)}</td>
            <td><span class="badge ${STATUS_BADGE[r.status]}">${esc(r.status_label)}</span>${r.out_of_city ? ' <span class="badge b-amber">خارج المدينة</span>' : ''}</td><td>${r.existing ? '<span class="badge">موجود</span>' : ''}${r.warn ? ` <span class="badge b-amber" title="${esc(r.warn)}">!</span>` : ''}</td></tr>`).join('')}</tbody></table></div>
        ${a.preview.length < a.valid ? `<p class="hint">تعرض أول ${a.preview.length} صف من ${a.valid}</p>` : ''}
        <div class="row" style="margin-top:12px"><button class="btn primary" id="commit" ${a.valid ? '' : 'disabled'}>اعتماد الاستيراد (${a.valid} صف)</button></div></div>`;
    const params = () => {
      const mapping = {}; $$('[data-map]').forEach((s) => { if (s.value !== '') mapping[s.dataset.map] = +s.value; });
      const color_actions = { ...st.color_actions }; $$('[data-color]').forEach((s) => color_actions[s.dataset.color] = s.value);
      const dm = $('#dmode'); const iv = $('#iv');
      return { token: st.token, mapping, color_actions, date_mode: dm ? dm.value : st.date_mode, interval: iv ? +iv.value : st.interval };
    };
    const repreview = async () => {
      const p = params();
      st.mapping = p.mapping; st.color_actions = p.color_actions; st.date_mode = p.date_mode; st.interval = p.interval;
      st.analysis = await guard(() => POST('/api/import/preview', p));
      render();
    };
    $$('[data-map],[data-color],#dmode,#iv').forEach((s) => s.onchange = repreview);
    const sh = $('#sheet');
    if (sh) sh.onchange = async () => { const r = await guard(() => POST('/api/import/sheet', { token: st.token, sheet: sh.value, use_font: $('#useFont').checked })); Object.assign(st, r); render(); };
    $('#commit').onclick = () => guard(async () => {
      if (!(await confirmBox(`استيراد ${a.valid} صف؟`, 'استيراد'))) return;
      const r = await POST('/api/import/commit', { ...params(), existing: $('#existing').value, update_dates: $('#updDates').checked, refer_not_eligible: $('#refer').checked,
        assign_mode: $('#assign').value, save_colors: $('#saveColors').checked });
      $('#imp').innerHTML = `<div class="card" style="margin-top:14px"><h3>تم الاستيراد ✔</h3><ul><li>مرضى جدد: <b>${r.created}</b></li><li>تم تحديثهم: <b>${r.updated}</b></li><li>تم تجاهلهم (موجودون): <b>${r.skipped}</b></li><li>صفوف بها أخطاء: <b>${r.errors}</b></li><li>إحالات لتجربة المريض: <b>${r.referred}</b></li>
        ${r.distribution ? `<li>التوزيع: ${Object.entries(r.distribution).map(([n, c]) => `${esc(n)} ${c}`).join('، ')}</li>` : ''}</ul><a class="btn primary" href="#/patients">عرض المرضى</a> <a class="btn" href="#/distribute">توزيع المرضى</a></div>`;
      $('#file').value = ''; refreshCounts();
    });
  };
};

// ============================================================ المستخدمون
VIEWS.users = async () => {
  const pg = page('المستخدمون', 'إنشاء الحسابات وإدارتها من المدير فقط — لا يوجد تسجيل ذاتي', '<button class="btn primary" id="newU">+ حساب جديد</button>');
  const load = async () => {
    S.users = await GET('/api/users');
    pg.innerHTML = `<div class="tw"><table class="t"><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الدور</th><th>الصلاحيات</th><th>المرضى المسندون</th><th>آخر دخول</th><th>الحالة</th><th></th></tr></thead><tbody>
      ${S.users.map((u) => `<tr><td><b>${esc(u.name)}</b></td><td class="mono">${esc(u.username)}</td><td>${esc(u.role_label)}</td>
        <td>${u.role === 'admin' ? 'كل الصلاحيات' : u.role === 'px' ? 'حالات تجربة المريض' : u.can_review ? '<span class="badge b-brand">صيدلي</span> + موظف' : 'موظف'}</td>
        <td class="num">${u.role === 'employee' ? u.assigned_count : '—'}</td><td>${u.last_login ? fmtTime(u.last_login) : '<span class="hint">لم يدخل بعد</span>'}${u.must_change_pw ? ' <span class="badge b-amber">كلمة مؤقتة</span>' : ''}</td>
        <td>${u.active ? '<span class="badge b-green">نشط</span>' : '<span class="badge">معطّل</span>'}</td>
        <td class="row" style="gap:4px"><button class="btn sm" data-a="edit" data-id="${u.id}">تعديل</button><button class="btn sm" data-a="reset" data-id="${u.id}">كلمة مرور</button>
          ${u.id !== S.me.id ? (u.active ? `<button class="btn sm danger" data-a="off" data-id="${u.id}">تعطيل</button>` : `<button class="btn sm" data-a="on" data-id="${u.id}">تفعيل</button>`) : ''}
          <a class="btn sm" href="#/audit?user=${u.id}">السجل</a></td></tr>`).join('')}</tbody></table></div>
      <p class="hint">تبقى سجلات الموظف محفوظة بعد تعطيل حسابه. يمكن منح دور الصيدلي لأي موظف.</p>`;
    $$('[data-a]', pg).forEach((b) => b.onclick = () => action(b.dataset.a, S.users.find((u) => u.id === +b.dataset.id)));
  };
  const form = (u) => {
    const isNew = !u; u = u || { role: 'employee' };
    const f = el(`<form><label class="f"><span class="req">اسم الموظف</span><input type="text" name="name" value="${esc(u.name || '')}"></label>
      ${isNew ? '<label class="f"><span class="req">اسم المستخدم (إنجليزي)</span><input type="text" name="username" dir="ltr" placeholder="ahmad.s"></label>' : ''}
      <label class="f"><span>الدور</span><select name="role">${[['employee', 'موظف'], ['px', 'تجربة المريض'], ['admin', 'المدير']].map(([k, v]) => `<option value="${k}" ${u.role === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label class="check"><input type="checkbox" name="can_review" ${u.can_review ? 'checked' : ''}> منح دور الصيدلي (مراجعة الاستحقاق)</label>
      <p class="hint">الموظف يرى المرضى المسندين إليه فقط. حساب تجربة المريض يستقبل الحالات المحالة تلقائيًا ولا يغيّر قرار الاستحقاق.</p><div class="err"></div></form>`);
    const m = modal(isNew ? 'حساب جديد' : 'تعديل الحساب', f, { footer: '<button class="btn primary" data-ok>حفظ</button>' });
    $('[data-ok]', m).onclick = async () => {
      const b = { name: f.name.value, role: f.role.value, can_review: f.can_review.checked };
      try {
        if (isNew) { b.username = f.username.value; const r = await POST('/api/users', b); m.close(); showPassword('تم إنشاء الحساب', b.username, r.temp_password); }
        else { await PATCH('/api/users/' + u.id, b); m.close(); toast('تم الحفظ'); }
        load();
      } catch (e) { $('.err', f).textContent = e.message; }
    };
  };
  const action = async (a, u) => {
    try {
      if (a === 'edit') form(u);
      if (a === 'reset') {
        if (!(await confirmBox(`إنشاء كلمة مرور مؤقتة جديدة لـ ${esc(u.name)}؟ سيُسجَّل خروجه من كل الأجهزة.`, 'إنشاء'))) return;
        const r = await POST(`/api/users/${u.id}/reset-password`); showPassword('كلمة مرور مؤقتة جديدة', u.username, r.temp_password);
      }
      if (a === 'on') { await POST(`/api/users/${u.id}/activate`); toast('تم التفعيل'); load(); }
      if (a === 'off') {
        const n = u.assigned_count || 0;
        if (u.role === 'employee' && n) {
          const m = modal(`تعطيل حساب ${esc(u.name)}`, `<p>لديه <b>${n}</b> مريض مسند. اختر إعادة الإسناد:</p>
            <select id="rt" style="width:100%"><option value="auto">توزيع تلقائي على بقية الموظفين</option>${userOptions('', (x) => x.role === 'employee' && x.active && x.id !== u.id)}</select>`,
          { footer: '<button class="btn danger" data-ok>تعطيل وإعادة الإسناد</button>' });
          $('[data-ok]', m).onclick = () => guard(async () => { await POST(`/api/users/${u.id}/deactivate`, { reassign: $('#rt', m).value }); m.close(); toast('تم تعطيل الحساب وإعادة الإسناد'); load(); refreshCounts(); });
        } else {
          if (!(await confirmBox(`تعطيل حساب ${esc(u.name)}؟`, 'تعطيل', true))) return;
          await POST(`/api/users/${u.id}/deactivate`, {}); toast('تم التعطيل'); load();
        }
      }
    } catch (e) { toast(e.message, true); }
  };
  $('#newU').onclick = () => form(null);
  await load();
};

// ============================================================ السجل
VIEWS.audit = async (qs) => {
  const pg = page('سجل الإجراءات', 'كل إجراء محفوظ باسم منفذه ووقته');
  pg.innerHTML = `<div class="filters" id="flt"><select name="user"><option value="">كل المستخدمين</option>${userOptions(qs.get('user'), () => true)}</select>
    <input type="date" name="from"><input type="date" name="to"><input type="search" name="q" placeholder="بحث في الإجراءات"></div><div id="list"></div>`;
  let pageNo = 1;
  const load = async () => {
    const p = new URLSearchParams({ page: pageNo });
    $$('#flt [name]').forEach((i) => i.value && p.set(i.name, i.value));
    const r = await GET('/api/audit?' + p);
    $('#list').innerHTML = `<div class="tw"><table class="t"><thead><tr><th>الوقت</th><th>المستخدم</th><th>الإجراء</th><th>رقم الملف</th><th>التفاصيل</th></tr></thead><tbody>
      ${r.items.map((x) => `<tr ${x.entity === 'patient' && x.entity_id ? `class="click" data-p="${x.entity_id}"` : ''}><td>${fmtTime(x.at)}</td><td>${esc(x.user_name || '')}</td><td>${esc(x.action)}</td><td class="mono">${esc(x.mrn || '')}</td><td class="hint">${esc(fmtDetails(x.details || ''))}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">لا يوجد</td></tr>'}</tbody></table></div>
      <div class="pager">${r.total} إجراء <button class="btn sm" id="prev" ${pageNo <= 1 ? 'disabled' : ''}>الأحدث</button><button class="btn sm" id="next" ${pageNo * 100 >= r.total ? 'disabled' : ''}>الأقدم</button></div>`;
    $('#prev').onclick = () => { pageNo--; load(); }; $('#next').onclick = () => { pageNo++; load(); };
    $$('[data-p]').forEach((tr) => tr.onclick = () => openPatient(+tr.dataset.p));
  };
  $$('#flt [name]').forEach((i) => i.addEventListener('input', debounce(() => { pageNo = 1; load(); }, 300)));
  await load();
};

// ============================================================ الإعدادات
VIEWS.settings = async () => {
  const pg = page('الإعدادات');
  const s = await GET('/api/settings');
  const v = s.values;
  const tpl = v.export_template;
  const fieldSel = (cur) => {
    const fixed = cur && cur.startsWith('fixed:');
    return `<select class="cf">${Object.entries(s.export_fields).map(([k, l]) => `<option value="${k}" ${cur === k ? 'selected' : ''}>${l}</option>`).join('')}<option value="fixed" ${fixed ? 'selected' : ''}>قيمة ثابتة…</option></select>
      <input type="text" class="cfv" placeholder="القيمة الثابتة" value="${fixed ? esc(cur.slice(6)) : ''}" ${fixed ? '' : 'hidden'}>`;
  };
  pg.innerHTML = `<div class="grid g2">
    <div class="card"><h3>عام</h3>
      <label class="f"><span>اسم الجهة (يظهر في الواجهة والرسائل)</span><input type="text" id="org" value="${esc(v.org_name)}"></label>
      <label class="f"><span>الوصف تحت الاسم</span><input type="text" id="orgSub" value="${esc(v.org_sub || '')}"></label>
      <div class="row" style="margin-bottom:12px"><div class="logo-prev" style="width:56px;height:56px;border-radius:14px;background:var(--brand);overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:700">${v.logo ? `<img src="${esc(v.logo)}" style="width:100%;height:100%;object-fit:contain;background:#fff">` : '℞'}</div>
        <div><span class="hint">شعار الجهة الرسمي (PNG أو SVG)</span><div class="row" style="margin-top:4px"><input type="file" id="logoFile" accept="image/*" hidden><button class="btn sm" id="logoBtn">رفع الشعار</button>${v.logo ? '<button class="btn sm danger" id="logoRm">إزالة</button>' : ''}</div></div>
        <span class="spacer"></span><label><span class="hint">لون الهوية</span><br><input type="color" id="brandColor" value="${esc(v.brand_color || '#0B6E73')}" style="width:56px;height:40px;border:none;background:none;padding:0"></label></div>
      <label class="f"><span>مدة الصرف الافتراضية (يحدد موعد المراجعة القادم لكل مستحق تلقائيًا)</span><input type="number" id="refillDef" min="1" max="365" value="${v.refill_default || 30}"></label>
      <label class="f"><span>يظهر المريض للصيدلي قبل موعده بعدد أيام</span><input type="number" id="lead" min="0" max="60" value="${v.lead_days}"></label>
      <label class="f"><span>مدينة الصيدلية (أي مدينة أخرى في الملف تُعلَّم «خارج المدينة» تلقائيًا — اتركها فارغة لتعطيل ذلك)</span><input type="text" id="city" value="${esc(v.home_city)}"></label>
      <label class="f"><span>مدد الصرف المقترحة للحساب التلقائي (أيام، مفصولة بفواصل)</span><input type="text" id="refill" value="${esc(v.refill_options.join(', '))}" dir="ltr"></label>
      <label class="f"><span>نطاق مراجعة الصيدلي</span><select id="scope"><option value="assigned" ${v.pharmacist_scope === 'assigned' ? 'selected' : ''}>يراجع المرضى المسندين إليه فقط</option><option value="all" ${v.pharmacist_scope === 'all' ? 'selected' : ''}>يراجع جميع المرضى المستحقين للمراجعة</option></select></label>
      <button class="btn primary" id="saveGen">حفظ</button></div>
    <div class="card"><h3>معاني الألوان عند الاستيراد</h3>
      ${Object.keys(s.color_labels).filter((c) => c !== 'none').map((c) => `<div class="row" style="margin-bottom:8px"><span class="dot" style="background:${COLOR_HEX[c]}"></span><b style="width:70px">${s.color_labels[c]}</b><span class="spacer"></span>
        <select data-color="${c}">${Object.entries(s.action_labels).map(([k, l]) => `<option value="${k}" ${(v.color_actions[c] || 'ignore') === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`).join('')}
      <button class="btn primary" id="saveCol">حفظ</button>
      <div class="sep"></div><h3>النسخ الاحتياطي</h3><p class="hint">يُحفظ نسخة تلقائية يوميًا عند تشغيل النظام في مجلد data/backups (آخر 14 نسخة).</p>
      <button class="btn" id="backup">تنزيل نسخة احتياطية الآن</button></div></div>
    <div class="card" style="margin-top:14px"><h3>قالب ملف التصدير (البريد السعودي)</h3>
      <p class="hint">التصدير يستخدم افتراضيًا نموذج البريد السعودي (SPL) المدمج بنفس بنيته حرفيًا. إذا تغيّر نموذج الشركة مستقبلًا، ارفع الملف الجديد هنا (يمكن أن يحتوي صفوف أمثلة). يتعرف النظام على العناوين ويستنتج من الأمثلة القيم الثابتة والرقم المرجعي، ثم يكتب البيانات داخل ملفك نفسه دون إعادة حفظه — فتبقى بنيته وبرمجته كما هي حرفيًا. صفوف الأمثلة لا تُصدَّر.</p>
      <div class="row"><input type="file" id="tplFile" accept=".xlsx,.xlsm"><button class="btn" id="upTpl">رفع القالب</button>
        <span class="badge b-green">القالب الحالي: ${esc(tpl.file_name)}</span><button class="btn sm" id="dlTpl">تنزيل نسخة فارغة</button>${tpl.builtin ? '' : '<button class="btn sm danger" id="rmTpl">الرجوع لقالب البريد المدمج</button>'}</div>
      <div class="sep"></div><b>ربط الأعمدة</b>
      <div class="tw" style="margin-top:8px"><table class="t" id="cols"><thead><tr><th>العمود</th><th>العنوان في الملف</th><th>البيانات</th><th></th></tr></thead><tbody>
        ${tpl.columns.map((c) => `<tr data-type="${c.type || 'str'}"><td class="num">${c.col}</td><td>${tpl.has_file ? esc(c.header) : `<input type="text" class="ch" value="${esc(c.header)}">`}</td><td>${fieldSel(c.field)}</td><td>${tpl.has_file ? '' : '<button class="icon-btn rm">✕</button>'}</td></tr>`).join('')}</tbody></table></div>
      <label class="row" style="margin-top:10px">بداية الرقم المرجعي المتسلسل في كل ملف <input type="number" id="refStart" value="${tpl.ref_start || 1}" style="width:110px"></label>
      <div class="row" style="margin-top:10px">${tpl.has_file ? '' : '<button class="btn" id="addCol">+ عمود</button>'}<button class="btn primary" id="saveCols">حفظ الربط</button><button class="btn" id="testExp">تنزيل ملف تجريبي</button></div></div>
    <div class="card" style="margin-top:14px"><h3>رسائل واتساب الجاهزة</h3>
      <p class="hint">المتغيرات: {الاسم} {رقم_الملف} {تاريخ_الاستحقاق} {العيادة} {الجهة} {ملاحظة_للمريض} {المطلوب_تصحيحه} — ولطلب الاستكمال: {رقم_الطلب} {المطلوب}. لا تُدرج الملاحظة الداخلية في أي رسالة.</p>
      <div class="grid g2">${[['not_eligible', 'غير مستحق حاليًا'], ['no_rx', 'لا توجد وصفة فعّالة'], ['wrong_data', 'بيانات خاطئة'], ['needs_info', 'طلب استكمال بيانات']].map(([k, l]) => `<label class="f"><span>${l}</span><textarea data-wa="${k}" rows="5">${esc(v.wa_templates[k] || '')}</textarea></label>`).join('')}</div>
      <button class="btn primary" id="saveWa">حفظ الرسائل</button></div>`;
  $('#saveGen').onclick = () => guard(async () => {
    await PUT('/api/settings', { org_name: $('#org').value, org_sub: $('#orgSub').value, brand_color: $('#brandColor').value, refill_default: +$('#refillDef').value, lead_days: +$('#lead').value, home_city: $('#city').value, pharmacist_scope: $('#scope').value,
      refill_options: $('#refill').value.split(/[,،\s]+/).filter(Boolean).map(Number) });
    const me = await GET('/api/me'); S.settings = me.settings; toast('تم الحفظ'); shell(); route();
  });
  $('#logoBtn').onclick = () => $('#logoFile').click();
  $('#logoFile').onchange = () => {
    const f = $('#logoFile').files[0]; if (!f) return;
    if (f.size > 500 * 1024) return toast('حجم الشعار كبير، استخدم صورة أصغر من 500 كيلوبايت', true);
    const rd = new FileReader();
    rd.onload = () => guard(async () => { await PUT('/api/settings', { logo: rd.result }); const me = await GET('/api/me'); S.settings = me.settings; toast('تم حفظ الشعار'); shell(); route(); });
    rd.readAsDataURL(f);
  };
  if ($('#logoRm')) $('#logoRm').onclick = () => guard(async () => { await PUT('/api/settings', { logo: '' }); const me = await GET('/api/me'); S.settings = me.settings; shell(); route(); });
  $('#saveCol').onclick = () => guard(async () => { const ca = {}; $$('[data-color]').forEach((x) => ca[x.dataset.color] = x.value); await PUT('/api/settings', { color_actions: ca }); toast('تم الحفظ'); });
  $('#saveWa').onclick = () => guard(async () => { const w = {}; $$('[data-wa]').forEach((x) => w[x.dataset.wa] = x.value); await PUT('/api/settings', { wa_templates: w }); toast('تم الحفظ'); });
  $('#backup').onclick = () => guard(() => download('GET', '/api/backup'));
  const bindCols = () => {
    $$('#cols .cf').forEach((s) => s.onchange = () => { s.nextElementSibling.hidden = s.value !== 'fixed'; });
    $$('#cols .rm').forEach((b) => b.onclick = () => { b.closest('tr').remove(); renum(); });
  };
  const renum = () => $$('#cols tbody tr').forEach((tr, i) => tr.cells[0].textContent = i + 1);
  bindCols();
  if ($('#addCol')) $('#addCol').onclick = () => { $('#cols tbody').appendChild(el(`<table><tr><td class="num"></td><td><input type="text" class="ch"></td><td>${fieldSel('empty')}</td><td><button class="icon-btn rm">✕</button></td></tr></table>`).rows[0]); renum(); bindCols(); };
  $('#saveCols').onclick = () => guard(async () => {
    const cols = $$('#cols tbody tr').map((tr, i) => {
      const f = $('.cf', tr).value;
      return { col: tpl.has_file ? +tr.cells[0].textContent : i + 1, header: tpl.has_file ? tr.cells[1].textContent : $('.ch', tr).value, field: f === 'fixed' ? 'fixed:' + $('.cfv', tr).value : f, type: tr.dataset.type || 'str' };
    });
    await PUT('/api/settings', { export_columns: cols, ref_start: +$('#refStart').value }); toast('تم حفظ ربط الأعمدة');
  });
  $('#testExp').onclick = () => guard(() => download('POST', '/api/export/test'));
  $('#upTpl').onclick = () => guard(async () => {
    const f = $('#tplFile').files[0]; if (!f) return toast('اختر ملف القالب', true);
    const fd = new FormData(); fd.append('file', f);
    const r = await api('POST', '/api/settings/export-template', fd);
    toast(`تم رفع القالب — ${r.template.columns.length} عمود. راجع الربط ثم احفظ`); VIEWS.settings();
  });
  if ($('#rmTpl')) $('#rmTpl').onclick = () => guard(async () => { if (!(await confirmBox('حذف القالب المرفوع والرجوع لقالب البريد المدمج؟', 'رجوع', true))) return; await api('DELETE', '/api/settings/export-template'); VIEWS.settings(); });
  if ($('#dlTpl')) $('#dlTpl').onclick = () => guard(() => download('GET', '/api/settings/export-template/file'));
};

boot();

</script>
